name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a cancelled deploy can
# leave the live site on a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check links and package site
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify internal links resolve
        run: node scripts/check-links.mjs .

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Publishes the repository root, so / serves index.html and
      # /containers-101/v1/ serves the course. The action excludes .git
      # and .github from the artifact.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
